<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TriPuzle - Progresivo</title>
  <style>
    * { touch-action: none; box-sizing: border-box; }
    body {
      margin: 0;
      background-color: #121316;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    #ui {
      position: absolute;
      top: 15px;
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 10;
    }
    .badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
    }
    #rotate-btn {
      display: none;
      position: absolute;
      bottom: 25px;
      background: #00f2ff;
      color: #000;
      border: none;
      padding: 14px 28px;
      font-weight: bold;
      font-size: 16px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,242,255,0.4);
      z-index: 10;
    }
    #win-modal {
      display: none;
      position: absolute;
      background: rgba(18, 19, 22, 0.95);
      border: 2px solid #00ff9d;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 0 30px rgba(0, 255, 157, 0.3);
      z-index: 20;
    }
    #win-modal h2 { margin: 0 0 10px 0; color: #00ff9d; font-size: 28px; }
    #win-modal button {
      background: #00ff9d;
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
    }
    svg { background: #121316; width: 100vw; height: 100vh; }
    .board-tile { fill: #22252a; stroke: #333842; stroke-width: 1.5; }
    .piece { cursor: grab; }
    .piece.selected polygon { stroke: #ffffff; stroke-width: 2.5; }
    .piece polygon { stroke: rgba(0,0,0,0.4); stroke-width: 1.5; }
  </style>
</head>
<body>

<div id="ui">
  <div class="badge" id="level-txt">Nivel 1</div>
</div>

<button id="rotate-btn">↻ Girar 120°</button>

<div id="win-modal">
  <h2>¡Enhorabuena! 🎉</h2>
  <p>Has completado el tablero perfectamente.</p>
  <button id="next-btn">Siguiente Nivel</button>
</div>

<svg id="app"></svg>

<script>
  const svg = document.getElementById('app');
  const levelTxt = document.getElementById('level-txt');
  const winModal = document.getElementById('win-modal');
  const nextBtn = document.getElementById('next-btn');
  const rotateBtn = document.getElementById('rotate-btn');

  const COLORS = ["#00f2ff", "#ff007f", "#00ff9d", "#ffaa00", "#a855f7", "#ff3366", "#33ccff"];
  
  let currentLevel = 1;
  let L = 50;
  let H = L * (Math.sqrt(3) / 2);
  let boardCells = [];
  let pieces = [];
  let selectedPiece = null;
  let dragOffset = { x: 0, y: 0 };

  // Detección de dispositivo móvil para mostrar botón táctil de rotación
  const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  if (isMobile) rotateBtn.style.display = 'block';

  function initLevel(level) {
    svg.innerHTML = '';
    boardCells = [];
    pieces = [];
    selectedPiece = null;
    winModal.style.display = 'none';
    levelTxt.innerText = `Nivel ${level}`;

    // El tablero crece según el nivel: Nivel 1 = 3 filas, Nivel 2 = 4 filas, etc.
    const ROWS = 2 + level; 
    
    // Ajustar escala visual si el tablero es muy grande
    L = Math.max(30, 60 - level * 3);
    H = L * (Math.sqrt(3) / 2);

    // Ajustar ViewBox dinámicamente al centro
    const width = window.innerWidth;
    const height = window.innerHeight;
    svg.setAttribute("viewBox", `${-width/2} ${-height/2} ${width} ${height}`);

    // 1. DIBUJAR TABLERO (Gran Triángulo)
    const boardGroup = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const totalHeight = ROWS * H;
    const startY = -totalHeight / 2 + (H / 2);

    for (let r = 0; r < ROWS; r++) {
      const count = r * 2 + 1;
      const y = startY + r * H;
      const startX = -(r * L / 2);

      for (let i = 0; i < count; i++) {
        const isUp = (i % 2 === 0);
        const x = startX + i * (L / 2);

        boardCells.push({ id: boardCells.length, x, y, isUp, occupied: false });

        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", getPoints(x, y, isUp));
        poly.setAttribute("class", "board-tile");
        boardGroup.appendChild(poly);
      }
    }
    svg.appendChild(boardGroup);

    // 2. FRAGMENTAR EN PIEZAS (Clusterizado por cercanía)
    const pieceGroups = generatePieceClusters(boardCells, level);

    // 3. CREAR Y POSICIONAR PIEZAS FUERA DEL TABLERO
    pieceGroups.forEach((cells, idx) => {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.setAttribute("class", "piece");

      const centerX = cells.reduce((sum, c) => sum + c.x, 0) / cells.length;
      const centerY = cells.reduce((sum, c) => sum + c.y, 0) / cells.length;

      cells.forEach(c => {
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", getPoints(c.x - centerX, c.y - centerY, c.isUp));
        poly.setAttribute("fill", COLORS[idx % COLORS.length]);
        group.appendChild(poly);
      });

      // Dispersar piezas alrededor del tablero
      const angle = (idx / pieceGroups.length) * Math.PI * 2;
      const radius = Math.min(width, height) * 0.35 + (ROWS * 10);
      const spawnX = Math.cos(angle) * radius;
      const spawnY = Math.sin(angle) * radius;

      group.state = {
        x: spawnX,
        y: spawnY,
        targetX: centerX,
        targetY: centerY,
        rot: 0,
        isSnapped: false
      };

      updateTransform(group);
      svg.appendChild(group);
      pieces.push(group);
    });
  }

  function getPoints(x, y, isUp) {
    return isUp 
      ? `${x},${y} ${x - L/2},${y + H} ${x + L/2},${y + H}`
      : `${x - L/2},${y} ${x + L/2},${y} ${x},${y + H}`;
  }

  // Algoritmo para agrupar celdas adyacentes en piezas
  function generatePieceClusters(cells, level) {
    const unvisited = [...cells];
    const clusters = [];
    const maxPieceSize = Math.max(3, 6 - Math.floor(level / 2)); // Piezas más pequeñas en niveles altos

    while (unvisited.length > 0) {
      const cluster = [];
      const targetSize = Math.floor(Math.random() * 2) + (maxPieceSize - 1);
      let current = unvisited.pop();
      cluster.push(current);

      for (let i = 0; i < unvisited.length && cluster.length < targetSize; i++) {
        const candidate = unvisited[i];
        // Comprobar si es contigua a alguna celda del cluster
        const isNeighbor = cluster.some(c => Math.hypot(c.x - candidate.x, c.y - candidate.y) < L * 1.1);
        if (isNeighbor) {
          cluster.push(candidate);
          unvisited.splice(i, 1);
          i--;
        }
      }
      clusters.push(cluster);
    }
    return clusters;
  }

  function updateTransform(piece) {
    const s = piece.state;
    piece.setAttribute("transform", `translate(${s.x}, ${s.y}) rotate(${s.rot})`);
  }

  function rotatePiece(piece) {
    if (!piece) return;
    piece.state.rot = (piece.state.rot + 120) % 360;
    updateTransform(piece);
    checkVictory();
  }

  // EVENTOS UNIFICADOS (Mouse + Touch)
  function getEventPos(e) {
    if (e.touches && e.touches.length > 0) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
    return { x: e.clientX, y: e.clientY };
  }

  function onStart(e) {
    const targetPiece = e.target.closest(".piece");
    if (!targetPiece) return;

    if (selectedPiece) selectedPiece.classList.remove("selected");
    selectedPiece = targetPiece;
    selectedPiece.classList.add("selected");
    svg.appendChild(selectedPiece);

    // Clic derecho en PC para rotar
    if (e.button === 2) {
      rotatePiece(selectedPiece);
      return;
    }

    const pos = getEventPos(e);
    const rect = svg.getBoundingClientRect();
    const svgX = pos.x - rect.left - rect.width / 2;
    const svgY = pos.y - rect.top - rect.height / 2;

    dragOffset = { x: svgX - selectedPiece.state.x, y: svgY - selectedPiece.state.y };
  }

  function onMove(e) {
    if (!selectedPiece) return;
    e.preventDefault();

    const pos = getEventPos(e);
    const rect = svg.getBoundingClientRect();
    const svgX = pos.x - rect.left - rect.width / 2;
    const svgY = pos.y - rect.top - rect.height / 2;

    selectedPiece.state.x = svgX - dragOffset.x;
    selectedPiece.state.y = svgY - dragOffset.y;
    updateTransform(selectedPiece);
  }

  function onEnd() {
    if (!selectedPiece) return;

    const s = selectedPiece.state;
    const distToTarget = Math.hypot(s.x - s.targetX, s.y - s.targetY);
    const isCorrectRotation = (s.rot % 360 === 0);

    // SNAP: Imantar si está cerca y con la rotación correcta
    if (distToTarget < L * 0.9 && isCorrectRotation) {
      s.x = s.targetX;
      s.y = s.targetY;
      s.isSnapped = true;
      updateTransform(selectedPiece);
      checkVictory();
    } else {
      s.isSnapped = false;
    }
  }

  function checkVictory() {
    const allSnapped = pieces.every(p => p.state.isSnapped && (p.state.rot % 360 === 0));
    if (allSnapped) {
      setTimeout(() => { winModal.style.display = 'block'; }, 200);
    }
  }

  // Listeners de entrada
  svg.addEventListener("mousedown", onStart);
  window.addEventListener("mousemove", onMove);
  window.addEventListener("mouseup", onEnd);

  svg.addEventListener("touchstart", onStart, { passive: false });
  window.addEventListener("touchmove", onMove, { passive: false });
  window.addEventListener("touchend", onEnd);

  rotateBtn.addEventListener("click", () => rotatePiece(selectedPiece));
  nextBtn.addEventListener("click", () => {
    currentLevel++;
    initLevel(currentLevel);
  });

  window.addEventListener("keydown", (e) => {
    if (e.key.toLowerCase() === "r" && selectedPiece) rotatePiece(selectedPiece);
  });

  window.addEventListener("contextmenu", e => e.preventDefault());
  window.addEventListener("resize", () => initLevel(currentLevel));

  // Iniciar primer nivel
  initLevel(currentLevel);
</script>
</body>
</html>
