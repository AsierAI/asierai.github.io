<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stanford Bunny — Reflexión</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

/* =========================================================
   CARGANDO
========================================================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #050505;
    color: #aaa;

    font-size: 12px;
    letter-spacing: 0.12em;
}


/* =========================================================
   BOTÓN DEL MENÚ
========================================================= */

#menuToggle {
    position: fixed;
    top: 20px;
    left: 20px;

    z-index: 30;

    width: 42px;
    height: 42px;

    padding: 0;

    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 50%;

    background: rgba(10,10,10,0.82);

    color: white;

    font-size: 20px;
    line-height: 42px;

    cursor: pointer;

    backdrop-filter: blur(12px);

    box-shadow:
        0 8px 30px rgba(0,0,0,0.4);

    transition:
        transform 0.2s,
        background 0.2s;
}

#menuToggle:hover {
    background: rgba(255,255,255,0.14);
}

#menuToggle.open {
    transform: rotate(90deg);
}


/* =========================================================
   PANEL
========================================================= */

#ui {
    position: fixed;

    top: 20px;
    left: 20px;

    z-index: 20;

    width: 280px;

    padding: 18px;

    padding-top: 76px;

    background: rgba(10,10,10,0.84);

    border:
        1px solid
        rgba(255,255,255,0.12);

    border-radius: 14px;

    backdrop-filter: blur(12px);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.45);

    transform:
        translateX(0);

    opacity: 1;

    transition:
        transform 0.28s ease,
        opacity 0.22s ease;
}


/* PANEL CERRADO */

#ui.closed {
    transform:
        translateX(
            calc(-100% - 25px)
        );

    opacity: 0;
    pointer-events: none;
}


/* =========================================================
   TÍTULO
========================================================= */

#title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 0.08em;
}

#subtitle {
    margin-top: 3px;
    margin-bottom: 18px;

    color: #888;

    font-size: 10px;
    letter-spacing: 0.15em;
}


/* =========================================================
   CONTROLES
========================================================= */

.control {
    margin-bottom: 14px;
}

.label {
    display: flex;
    justify-content: space-between;

    margin-bottom: 6px;

    color: #aaa;

    font-size: 11px;
}

.value {
    color: white;
}

input[type="range"] {
    width: 100%;
}


/* =========================================================
   BOTONES
========================================================= */

button.controlButton {
    width: 100%;

    margin-top: 7px;

    padding: 9px;

    border:
        1px solid
        rgba(255,255,255,0.18);

    border-radius: 8px;

    background:
        rgba(255,255,255,0.07);

    color: white;

    cursor: pointer;

    font-size: 11px;

    transition:
        background 0.15s,
        border-color 0.15s;
}

button.controlButton:hover {
    background:
        rgba(255,255,255,0.14);

    border-color:
        rgba(255,255,255,0.3);
}


/* =========================================================
   INFORMACIÓN
========================================================= */

#info {
    margin-top: 12px;
    padding-top: 10px;

    border-top:
        1px solid
        rgba(255,255,255,0.08);

    color: #666;

    font-size: 9px;
    line-height: 1.5;
}


/* =========================================================
   EN MÓVIL
========================================================= */

@media (max-width: 600px) {

    #ui {
        width: 260px;
    }

}
</style>


<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>

</head>


<body>


<div id="loading">
    CARGANDO STANFORD BUNNY...
</div>


<!-- =====================================================
     BOTÓN MENU
===================================================== -->

<button
    id="menuToggle"
    aria-label="Abrir menú"
>
    ☰
</button>


<!-- =====================================================
     MENU
===================================================== -->

<div id="ui">

    <div id="title">
        STANFORD BUNNY
    </div>

    <div id="subtitle">
        POINT CLOUD
    </div>


    <!-- VELOCIDAD -->

    <div class="control">

        <div class="label">

            <span>
                VELOCIDAD
            </span>

            <span
                class="value"
                id="speedValue"
            >
                0.45
            </span>

        </div>

        <input
            id="speed"
            type="range"
            min="0"
            max="2"
            step="0.01"
            value="0.45"
        >

    </div>


    <!-- RESOLUCIÓN -->

    <div class="control">

        <div class="label">

            <span>
                RESOLUCIÓN
            </span>

            <span
                class="value"
                id="resolutionValue"
            >
                100%
            </span>

        </div>

        <input
            id="resolution"
            type="range"
            min="1"
            max="100"
            step="1"
            value="100"
        >

        <div
            class="label"
            style="margin-top:6px;"
        >

            <span>
                PUNTOS
            </span>

            <span
                class="value"
                id="pointCount"
            >
                —
            </span>

        </div>

    </div>


    <!-- MODO -->

    <button
        id="modeButton"
        class="controlButton"
    >
        PUNTOS → 3D
    </button>


    <!-- REFLEXIÓN -->

    <button
        id="reflectionButton"
        class="controlButton"
    >
        REFLEJAR
    </button>


    <!-- PAUSA -->

    <button
        id="pauseButton"
        class="controlButton"
    >
        PAUSAR
    </button>


    <!-- COLOR -->

    <button
        id="colorButton"
        class="controlButton"
    >
        CAMBIAR COLOR
    </button>


    <div id="info">

        PLANO DE REFLEXIÓN<br>

        Pasa por el centro del conejo y es
        siempre perpendicular al haz central
        de la cámara.

    </div>

</div>


<script type="module">

import * as THREE from "three";

import {
    PLYLoader
} from "three/addons/loaders/PLYLoader.js";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const MODEL_URL =
    "https://raw.githubusercontent.com/naucoin/VTKData/master/Data/bunny.ply";


let rotationSpeed = 0.45;

let rotation = 0;

let autoRotate = true;

let reflectionEnabled = false;

let surfaceMode = false;

let colorIndex = 0;


const colors = [
    0xffffff,
    0x00d4ff,
    0xff5577,
    0xffcc44,
    0x88ff88,
    0xbb88ff
];


/* =========================================================
   ESCENA
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x050505);


/* =========================================================
   CÁMARA ORTOGRÁFICA
========================================================= */

const frustumSize = 3.2;

let aspect =
    window.innerWidth /
    window.innerHeight;


const camera =
    new THREE.OrthographicCamera(

        -frustumSize * aspect / 2,

         frustumSize * aspect / 2,

         frustumSize / 2,

        -frustumSize / 2,

        0.01,
        100
    );


camera.position.set(
    0,
    0.25,
    3.5
);

camera.lookAt(
    0,
    0,
    0
);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   CONTROLES
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );


controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.target.set(
    0,
    0,
    0
);


/* =========================================================
   LUCES
========================================================= */

const hemisphere =
    new THREE.HemisphereLight(
        0xffffff,
        0x222222,
        2.2
    );

scene.add(
    hemisphere
);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        4
    );


keyLight.position.set(
    3,
    5,
    4
);

keyLight.castShadow = true;

keyLight.shadow.mapSize.set(
    2048,
    2048
);

scene.add(
    keyLight
);


const fillLight =
    new THREE.DirectionalLight(
        0x88aaff,
        1.5
    );


fillLight.position.set(
    -4,
    2,
    2
);

scene.add(
    fillLight
);


const rimLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );


rimLight.position.set(
    0,
    3,
    -5
);

scene.add(
    rimLight
);


/* =========================================================
   SUELO
========================================================= */

const floor =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            20,
            20
        ),

        new THREE.ShadowMaterial({
            opacity: 0.22
        })
    );


floor.rotation.x =
    -Math.PI / 2;

floor.position.y =
    -1.05;

floor.receiveShadow = true;

scene.add(
    floor
);


/* =========================================================
   JERARQUÍA
========================================================= */

const reflectionGroup =
    new THREE.Group();

scene.add(
    reflectionGroup
);


const bunnyGroup =
    new THREE.Group();

reflectionGroup.add(
    bunnyGroup
);


/* =========================================================
   MATERIALES
========================================================= */

const pointMaterial =
    new THREE.PointsMaterial({

        color:
            colors[colorIndex],

        size:
            0.014,

        sizeAttenuation:
            true,

        transparent:
            true,

        opacity:
            0.95,

        depthWrite:
            false
    });


const surfaceMaterial =
    new THREE.MeshStandardMaterial({

        color:
            colors[colorIndex],

        roughness:
            0.58,

        metalness:
            0,

        side:
            THREE.DoubleSide
    });


/* =========================================================
   GEOMETRÍAS
========================================================= */

let originalGeometry = null;

let pointGeometry = null;

let points = null;

let surface = null;

let originalPositions = null;

let totalPoints = 0;


/* =========================================================
   CARGAR MODELO
========================================================= */

const loader =
    new PLYLoader();


loader.load(

    MODEL_URL,

    geometry => {

        geometry.computeBoundingBox();


        const center =
            new THREE.Vector3();


        geometry.boundingBox.getCenter(
            center
        );


        geometry.translate(
            -center.x,
            -center.y,
            -center.z
        );


        geometry.computeBoundingBox();


        const size =
            new THREE.Vector3();


        geometry.boundingBox.getSize(
            size
        );


        const maxDimension =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        const scale =
            2 / maxDimension;


        geometry.scale(
            scale,
            scale,
            scale
        );


        geometry.computeVertexNormals();


        originalGeometry =
            geometry.clone();


        const position =
            originalGeometry
                .attributes
                .position;


        originalPositions =
            new Float32Array(
                position.array
            );


        totalPoints =
            position.count;


        /* POINT CLOUD */

        pointGeometry =
            new THREE.BufferGeometry();


        updateResolution(100);


        points =
            new THREE.Points(
                pointGeometry,
                pointMaterial
            );


        points.frustumCulled =
            false;


        bunnyGroup.add(
            points
        );


        /* SUPERFICIE */

        surface =
            new THREE.Mesh(
                originalGeometry,
                surfaceMaterial
            );


        surface.castShadow =
            true;


        surface.receiveShadow =
            true;


        surface.visible =
            false;


        bunnyGroup.add(
            surface
        );


        document.getElementById(
            "loading"
        ).style.display =
            "none";
    },


    xhr => {

        if (xhr.total) {

            const progress =
                Math.round(
                    xhr.loaded /
                    xhr.total *
                    100
                );


            document.getElementById(
                "loading"
            ).textContent =
                `CARGANDO STANFORD BUNNY ${progress}%`;
        }
    },


    error => {

        console.error(error);


        document.getElementById(
            "loading"
        ).textContent =
            "ERROR CARGANDO EL MODELO";
    }
);


/* =========================================================
   RESOLUCIÓN
========================================================= */

function updateResolution(
    percentage
) {

    if (
        !originalPositions ||
        !pointGeometry
    )
        return;


    const count =
        Math.max(
            1,

            Math.floor(
                totalPoints *
                percentage /
                100
            )
        );


    const data =
        new Float32Array(
            count * 3
        );


    const step =
        totalPoints / count;


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const source =
            Math.floor(
                i * step
            );


        data[i * 3] =
            originalPositions[
                source * 3
            ];


        data[i * 3 + 1] =
            originalPositions[
                source * 3 + 1
            ];


        data[i * 3 + 2] =
            originalPositions[
                source * 3 + 2
            ];
    }


    pointGeometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            data,
            3
        )
    );


    pointGeometry.computeBoundingSphere();


    document.getElementById(
        "pointCount"
    ).textContent =
        count.toLocaleString();
}


/* =========================================================
   REFLEXIÓN
========================================================= */

const cameraDirection =
    new THREE.Vector3();


const reflectionMatrix =
    new THREE.Matrix4();


function updateReflection() {

    /*
       Dirección del haz central.
    */

    camera.getWorldDirection(
        cameraDirection
    );


    cameraDirection.normalize();


    const nx =
        cameraDirection.x;

    const ny =
        cameraDirection.y;

    const nz =
        cameraDirection.z;


    /*
       R = I - 2nnᵀ
    */

    reflectionMatrix.set(

        1 - 2 * nx * nx,
        -2 * nx * ny,
        -2 * nx * nz,
        0,

        -2 * ny * nx,
        1 - 2 * ny * ny,
        -2 * ny * nz,
        0,

        -2 * nz * nx,
        -2 * nz * ny,
        1 - 2 * nz * nz,
        0,

        0,
        0,
        0,
        1
    );


    if (reflectionEnabled) {

        reflectionGroup.matrixAutoUpdate =
            false;


        reflectionGroup.matrix.copy(
            reflectionMatrix
        );


        reflectionGroup.matrixWorldNeedsUpdate =
            true;

    } else {

        reflectionGroup.matrixAutoUpdate =
            true;


        reflectionGroup.position.set(
            0,
            0,
            0
        );


        reflectionGroup.rotation.set(
            0,
            0,
            0
        );


        reflectionGroup.scale.set(
            1,
            1,
            1
        );


        reflectionGroup.updateMatrix();
    }
}


/* =========================================================
   ROTACIÓN DEL CONEJO
========================================================= */

function updateBunny() {

    bunnyGroup.rotation.set(
        -0.10,
        rotation,
        0
    );
}


/* =========================================================
   MENÚ RETRÁCTIL
========================================================= */

const menuToggle =
    document.getElementById(
        "menuToggle"
    );


const ui =
    document.getElementById(
        "ui"
    );


let menuOpen = true;


menuToggle.addEventListener(
    "click",
    () => {

        menuOpen =
            !menuOpen;


        ui.classList.toggle(
            "closed",
            !menuOpen
        );


        menuToggle.classList.toggle(
            "open",
            menuOpen
        );


        menuToggle.textContent =
            menuOpen
                ? "×"
                : "☰";
    }
);


/* =========================================================
   VELOCIDAD
========================================================= */

document.getElementById(
    "speed"
).addEventListener(
    "input",
    event => {

        rotationSpeed =
            parseFloat(
                event.target.value
            );


        document.getElementById(
            "speedValue"
        ).textContent =
            rotationSpeed.toFixed(2);
    }
);


/* =========================================================
   RESOLUCIÓN
========================================================= */

document.getElementById(
    "resolution"
).addEventListener(
    "input",
    event => {

        const value =
            parseInt(
                event.target.value
            );


        document.getElementById(
            "resolutionValue"
        ).textContent =
            `${value}%`;


        updateResolution(
            value
        );
    }
);


/* =========================================================
   PUNTOS / SUPERFICIE
========================================================= */

document.getElementById(
    "modeButton"
).addEventListener(
    "click",
    () => {

        surfaceMode =
            !surfaceMode;


        if (points) {

            points.visible =
                !surfaceMode;
        }


        if (surface) {

            surface.visible =
                surfaceMode;
        }


        document.getElementById(
            "modeButton"
        ).textContent =

            surfaceMode
                ? "3D → PUNTOS"
                : "PUNTOS → 3D";


        document.getElementById(
            "subtitle"
        ).textContent =

            surfaceMode
                ? "3D SURFACE"
                : "POINT CLOUD";
    }
);


/* =========================================================
   REFLEXIÓN
========================================================= */

document.getElementById(
    "reflectionButton"
).addEventListener(
    "click",
    () => {

        reflectionEnabled =
            !reflectionEnabled;


        document.getElementById(
            "reflectionButton"
        ).textContent =

            reflectionEnabled
                ? "QUITAR REFLEJO"
                : "REFLEJAR";


        updateReflection();
    }
);


/* =========================================================
   PAUSA
========================================================= */

document.getElementById(
    "pauseButton"
).addEventListener(
    "click",
    () => {

        autoRotate =
            !autoRotate;


        document.getElementById(
            "pauseButton"
        ).textContent =

            autoRotate
                ? "PAUSAR"
                : "CONTINUAR";
    }
);


/* =========================================================
   COLOR
========================================================= */

document.getElementById(
    "colorButton"
).addEventListener(
    "click",
    () => {

        colorIndex =
            (colorIndex + 1) %
            colors.length;


        pointMaterial.color.setHex(
            colors[colorIndex]
        );


        surfaceMaterial.color.setHex(
            colors[colorIndex]
        );
    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        const aspect =
            window.innerWidth /
            window.innerHeight;


        camera.left =
            -frustumSize *
            aspect /
            2;


        camera.right =
            frustumSize *
            aspect /
            2;


        camera.top =
            frustumSize /
            2;


        camera.bottom =
            -frustumSize /
            2;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   ANIMACIÓN
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    controls.update();


    if (autoRotate) {

        rotation +=
            rotationSpeed *
            delta;
    }


    /*
       Primero gira el conejo.
    */

    updateBunny();


    /*
       Después calculamos el plano
       perpendicular al haz actual
       de la cámara.
    */

    updateReflection();


    renderer.render(
        scene,
        camera
    );
}


animate();

</script>

</body>
</html>
