<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asier AI — Gadgets & Apps</title>
  <style>
    :root {
      --bg-base: #0b0d12;
      --bg-surface: rgba(22, 27, 38, 0.78);
      --bg-surface-hover: rgba(30, 37, 52, 0.94);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 179, 237, 0.45);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-2: #818cf8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      padding: 2.5rem 1.25rem 4rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Fondo decorativo con malla y resplandor ambiental */
    .bg-decor {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 15% 10%, rgba(56, 189, 248, 0.14), transparent 40%),
        radial-gradient(circle at 85% 20%, rgba(129, 140, 248, 0.14), transparent 42%),
        radial-gradient(circle at 50% 95%, rgba(56, 189, 248, 0.08), transparent 45%);
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 85%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 85%);
    }

    .page-wrapper {
      position: relative;
      z-index: 1;
      max-width: 1060px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.9rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 4vw, 2.85rem);
      font-weight: 750;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 20%, #93c5fd 65%, #c4b5fd 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 0 auto;
      max-width: 540px;
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 1.5rem;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      border: 1px solid var(--border-subtle);
      transition: transform 0.22s ease, border-color 0.22s ease, background-color 0.22s ease, box-shadow 0.22s ease;
    }

    .card:hover,
    .card:focus-visible {
      transform: translateY(-5px);
      border-color: var(--border-hover);
      background: var(--bg-surface-hover);
      box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.65);
      outline: none;
    }

    .card-thumb {
      width: 100%;
      height: 155px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(129, 140, 248, 0.16));
      border-bottom: 1px solid var(--border-subtle);
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .thumb-monogram {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.4);
      user-select: none;
    }

    .card-body {
      padding: 1.15rem 1.2rem 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-body h3 {
      margin: 0 0 0.45rem;
      font-size: 1.12rem;
      text-transform: capitalize;
      letter-spacing: -0.01em;
    }

    .card-body p {
      margin: 0 0 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.45;
      flex: 1;
    }

    .card-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .card:hover .card-link {
      text-decoration: underline;
    }

    .status-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 2.5rem 1.5rem;
      border-radius: 16px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="page-wrapper">
    <header>
      <span class="badge">Asier AI · Laboratorio</span>
      <h1>Mis Aplicaciones</h1>
      <p class="subtitle">Colección de herramientas, experimentos y pequeños gadgets publicados automáticamente desde el repositorio.</p>
    </header>

    <main class="grid" id="apps-container">
      <div class="status-box">Cargando aplicaciones...</div>
    </main>
  </div>

  <script>
    const USERNAME = 'asierai';
    const REPO = 'asierai.github.io';
    // Opcional: si en cada carpeta subes una imagen llamada 'preview.png', puedes activar esta ruta:
    // `./${carpeta.name}/preview.png`
    const USAR_IMAGEN_CARPETA = false;

    function formatearNombre(nombre) {
      return nombre.replace(/[-_]+/g, ' ');
    }

    function obtenerIniciales(nombre) {
      const partes = nombre.split(/[-_]+/).filter(Boolean);
      return partes.slice(0, 2).map(p => p[0].toUpperCase()).join('') || 'APP';
    }

    async function obtenerCarpetas() {
      const contenedor = document.getElementById('apps-container');

      try {
        const respuesta = await fetch(`https://api.github.com/repos/${USERNAME}/${REPO}/contents`);
        if (!respuesta.ok) {
          throw new Error(`Error HTTP ${respuesta.status}`);
        }

        const elementos = await respuesta.json();

        // Filtra para quedarse solo con carpetas (excluyendo ocultas o especiales)
        const carpetas = elementos.filter(el => el.type === 'dir' && !el.name.startsWith('.'));

        if (carpetas.length === 0) {
          contenedor.innerHTML = `<div class="status-box">No se encontraron carpetas de aplicaciones todavía.</div>`;
          return;
        }

        contenedor.innerHTML = carpetas.map(carpeta => {
          const titulo = formatearNombre(carpeta.name);
          const iniciales = obtenerIniciales(carpeta.name);
          const mediaHtml = USAR_IMAGEN_CARPETA
            ? `<img src="./${carpeta.name}/preview.png" alt="${titulo}" onerror="this.remove(); this.parentElement.insertAdjacentHTML('afterbegin', '<span class=&quot;thumb-monogram&quot;>${iniciales}</span>');">`
            : `<span class="thumb-monogram">${iniciales}</span>`;

          return `
            <a href="./${carpeta.name}/" class="card">
              <div class="card-thumb">
                ${mediaHtml}
              </div>
              <div class="card-body">
                <h3>${titulo}</h3>
                <p>Acceder a la aplicación ${titulo}</p>
                <span class="card-link">Abrir gadget →</span>
              </div>
            </a>
          `;
        }).join('');
      } catch (error) {
        console.error(error);
        contenedor.innerHTML = `<div class="status-box">No se pudieron cargar las aplicaciones en este momento.</div>`;
      }
    }

    obtenerCarpetas();
  </script>
</body>
</html>
