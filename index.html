<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Gadgets</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: white; padding: 2rem; }
    h1 { text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; max-width: 900px; margin: 2rem auto; }
    .card { background: #2a2a2a; border-radius: 10px; overflow: hidden; text-decoration: none; color: white; transition: transform 0.2s; border: 1px solid #333; }
    .card:hover { transform: translateY(-5px); }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-body { padding: 1rem; }
    .card-body h3 { margin: 0 0 0.5rem 0; }
    .card-body p { margin: 0; color: #aaa; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Mis Gadgets y Aplicaciones</h1>

  <div class="grid">
    <!-- Gadget 1 -->
    <a href="./gadget-1/" class="card">
      <img src="https://via.placeholder.com/300x160" alt="Gadget 1">
      <div class="card-body">
        <h3>Gadget 1</h3>
        <p>Descripción corta de la app 1.</p>
      </div>
    </a>

    <!-- Gadget 2 -->
    <a href="./gadget-2/" class="card">
      <img src="https://via.placeholder.com/300x160" alt="Gadget 2">
      <div class="card-body">
        <h3>Gadget 2</h3>
        <p>Descripción corta de la app 2.</p>
      </div>
    </a>
  </div>
</body>
</html>
